name: messfellows
description: "Mess Fellows — offline-first mess/meal management for shared households."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local database (SQLite via drift) — see lib/database/.
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1

  # State management.
  flutter_riverpod: ^3.4.3

  # Stable, collision-safe IDs so records survive a future cloud sync.
  uuid: ^4.6.0

  # Date/number formatting.
  intl: ^0.20.3

  # Native share sheet for the monthly summary.
  share_plus: ^13.3.0

  # File picker for JSON backup import.
  file_picker: ^13.1.0

  collection: ^1.19.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

  # Generate the app icon and splash screen from assets/branding/ — see
  # flutter_launcher_icons.yaml and flutter_native_splash.yaml.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  generate: true
